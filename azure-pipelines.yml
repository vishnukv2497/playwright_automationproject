# Playwright tests for https://www.saucedemo.com
#
#   Pull requests    -> @smoke on Chromium
#   Nightly schedule -> @smoke + @regression on Chromium, Firefox and WebKit
#
# Both run sharded across 3 agents. Each shard publishes its JUnit results to the Tests tab and a blob report;
# the Report stage merges the blobs into one HTML report (with traces) and publishes it as an artifact.
#
# One-time setup in Azure DevOps:
#   1. Pipelines > this pipeline > Edit > Variables: add SAUCE_PASSWORD and tick "Keep this value secret".
#   2. Azure Repos only: YAML `pr:` triggers are ignored there. Add this pipeline as a Build Validation
#      branch policy on main to run smoke on every PR.
#   3. Run the pipeline once manually with "Regenerate the Linux screenshot baselines" ticked, download the
#      linux-screenshot-baselines artifact, and commit its *-chromium-linux.png files to
#      tests/ui/visual.spec.ts-snapshots/. Until then the visual tests fail on Linux agents.

trigger: none

pr:
  branches:
    include:
      - '*'

schedules:
  - cron: '0 2 * * *' # 02:00 UTC every day
    displayName: Nightly regression
    branches:
      include:
        - main
    always: true # run even without new commits: the site under test changes on its own

parameters:
  - name: suite
    displayName: Suite (auto = regression on the nightly schedule, smoke otherwise)
    type: string
    default: auto
    values:
      - auto
      - smoke
      - regression
  - name: updateSnapshots
    displayName: Regenerate the Linux screenshot baselines instead of running the tests
    type: boolean
    default: false

variables:
  # Azure Pipelines doesn't set CI. playwright.config.ts uses it for retries (2), workers (1) and forbidOnly.
  CI: 'true'
  nodeVersion: '20.x'
  ${{ if or(eq(parameters.suite, 'regression'), and(eq(parameters.suite, 'auto'), eq(variables['Build.Reason'], 'Schedule'))) }}:
    suiteName: regression
    testGrep: '@smoke|@regression'
    projectArgs: '--project=chromium --project=firefox --project=webkit'
  ${{ else }}:
    suiteName: smoke
    testGrep: '@smoke'
    projectArgs: '--project=chromium'

stages:
  - ${{ if eq(parameters.updateSnapshots, true) }}:
      - stage: Baselines
        displayName: Regenerate Linux screenshot baselines
        jobs:
          - job: update
            displayName: Update visual.spec.ts baselines (Chromium)
            timeoutInMinutes: 20
            pool:
              vmImage: ubuntu-latest
            steps:
              - task: UseNode@1
                displayName: Use Node 20
                inputs:
                  version: $(nodeVersion)
              - script: npm ci
                displayName: npm ci
              - script: npx playwright install --with-deps chromium
                displayName: Install Chromium and OS dependencies
              # Never include the visual_user test: it would write its broken screenshot as the baseline.
              - script: npx playwright test tests/ui/visual.spec.ts --project=chromium --update-snapshots --grep-invert visual_user --reporter=list
                displayName: Write new baselines
                env:
                  SAUCE_PASSWORD: $(SAUCE_PASSWORD)
              - publish: tests/ui/visual.spec.ts-snapshots
                artifact: linux-screenshot-baselines
                displayName: Publish baselines (commit the *-chromium-linux.png files)

  - ${{ else }}:
      - stage: Test
        displayName: Run tests (3 shards)
        jobs:
          - job: shard
            displayName: Shard
            timeoutInMinutes: 30
            strategy:
              parallel: 3
            pool:
              vmImage: ubuntu-latest
            steps:
              - task: UseNode@1
                displayName: Use Node 20
                inputs:
                  version: $(nodeVersion)

              - script: npm ci
                displayName: npm ci

              - script: npx playwright install --with-deps
                displayName: Install Playwright browsers and OS dependencies

              # PROJECT_ARGS is left unquoted on purpose so it splits into separate --project flags.
              - script: >-
                  npx playwright test
                  --grep "$TEST_GREP"
                  $PROJECT_ARGS
                  --shard=$(System.JobPositionInPhase)/$(System.TotalJobsInPhase)
                  --reporter=list,blob,junit
                displayName: Run Playwright tests
                env:
                  SAUCE_PASSWORD: $(SAUCE_PASSWORD) # secret: only mapped into this step
                  TEST_GREP: $(testGrep)
                  PROJECT_ARGS: $(projectArgs)
                  PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/junit.xml

              - task: PublishTestResults@2
                displayName: Publish JUnit results to the Tests tab
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: reports/junit.xml
                  testRunTitle: Playwright $(suiteName) - shard $(System.JobPositionInPhase)

              - publish: blob-report
                artifact: blob-report-$(System.JobPositionInPhase)
                displayName: Publish blob report for merging
                condition: succeededOrFailed()

              - publish: test-results
                artifact: test-results-shard-$(System.JobPositionInPhase)
                displayName: Publish traces, screenshots and videos of failed tests
                condition: failed()

      - stage: Report
        displayName: Merge HTML report
        dependsOn: Test
        condition: succeededOrFailed() # build the report even when tests failed
        jobs:
          - job: merge
            displayName: Merge shard reports
            timeoutInMinutes: 15
            pool:
              vmImage: ubuntu-latest
            steps:
              - task: UseNode@1
                displayName: Use Node 20
                inputs:
                  version: $(nodeVersion)

              - script: npm ci
                displayName: npm ci

              - download: current
                displayName: Download blob reports from all shards
                patterns: 'blob-report-*/*.zip'

              - script: |
                  mkdir -p all-blob-reports
                  cp "$(Pipeline.Workspace)"/blob-report-*/*.zip all-blob-reports/
                  npx playwright merge-reports --reporter=html ./all-blob-reports
                displayName: Merge shards into one HTML report
                env:
                  PLAYWRIGHT_HTML_OPEN: never

              - publish: playwright-report
                artifact: playwright-report
                displayName: Publish HTML report (with traces)
